[pytest]
testpaths = tests/tilt-engine
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --cov=tests/tilt-engine
    --cov-report=term-missing
    --cov-report=html:tests/coverage_html
    --cov-fail-under=80
markers =
    snapshot: Tests for service snapshot functionality
    daemon: Tests for discovery daemon
    health: Tests for health check endpoints
    ide: Tests for IDE components
    safety: Tests for safety guards
    cache: Tests for registry cache
    integration: Integration tests
    slow: Slow running tests
    fast: Fast unit tests (no external deps, run in <1s)
    generator: Docker/Compose generator tests
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
