name: Prisma Postgres E2E

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "engine/topologies/tilt/resources/orchestrator/apply_compose_resource_registration.star"
      - "engine/topologies/tilt/resources/infra-loader.star"
      - "engine/topologies/tilt/generators/typescript/prisma_config.star"
      - "engine/topologies/platform/docker/layers/prisma/**"
      - "cli/src/commands/resource.ts"
      - "scripts/e2e/prisma-postgres.sh"
      - "tests/e2e/fixtures/native-prisma-postgres/**"
      - ".github/workflows/prisma-postgres-e2e.yml"

permissions:
  contents: read

concurrency:
  group: prisma-postgres-e2e${{ github.event_name == 'pull_request' && format('-pr-{0}', github.event.pull_request.number) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prisma-postgres:
    name: Prisma service with a Postgres dependency through tdk up
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2

      - name: Install Tilt
        run: curl -fsSL https://raw.githubusercontent.com/tilt-dev/tilt/master/scripts/install.sh | bash

      # ubuntu-latest ships a Postgres service already listening on 5432, which fails tdk doctor's host-port check.
      - name: Free port 5432 (runner's preinstalled Postgres)
        run: |
          sudo systemctl stop postgresql.socket 'postgresql@*.socket' 2>/dev/null || true
          sudo systemctl stop postgresql.service 'postgresql@*.service' 2>/dev/null || true
          sudo DEBIAN_FRONTEND=noninteractive apt-get remove --purge -y 'postgresql*' 2>&1 | sudo tee /tmp/pg-purge.log > /dev/null || true
          sudo fuser -k 5432/tcp 2>/dev/null || true
          sleep 2
          if sudo ss -ltn 2>/dev/null | grep -q ':5432 '; then
            echo "::error::port 5432 is still in use after purging postgresql"
            exit 1
          fi

      - name: Install CLI dependencies
        working-directory: cli
        run: bun install --frozen-lockfile

      # Scaffolds a native backend with the prisma feature and dependsOn postgres, starts it with `tdk up`, applies its migrations,
      # POSTs an order through Traefik, and reads the row back from Postgres.
      - name: Run the Prisma and Postgres check
        run: scripts/e2e/prisma-postgres.sh
